name: MC-10 regression

on:
  push:
  pull_request:

jobs:
  portable:
    name: Portable build and cassette checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install assembler
        run: |
          sudo apt-get update
          sudo apt-get install --yes crasm

      - name: Build game cassette
        run: bash scripts/build.sh build

      - name: Build utility cassette
        run: bash scripts/build.sh utility

      - name: Build timing calibrator cassette
        run: bash scripts/build.sh calibrator

      - name: Run portable regression checks
        run: python3 scripts/regression.py --skip-emulator
